<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings</title>
<!-- On the home screen it runs as an app, with the switch at the bottom. The manifest
     is fetched with the front door's cookie, like Talk's. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Settings">
<link rel="apple-touch-icon" href="icon.png">
<script src="webxdc.js"></script>
<link rel="stylesheet" href="desk.css">
<style>
  /* tokens: desk.css */
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:17px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif }
  main { max-width:560px; margin:0 auto; padding:10px 14px 40px }
  .nav { display:flex; align-items:center; min-height:34px }
  .nav:empty { display:none }   /* the home has no back button: no 34 px band above the first cap */
  .back { border:0; background:none; color:var(--tint); font:inherit; padding:4px 0; cursor:pointer }
  .back::before { content:"\2039"; font-size:1.6rem; line-height:1; margin-right:4px; vertical-align:-2px }
  h1 { font-size:1.5rem; margin:.2em 4px .1em }
  .sub { color:var(--muted); font-size:.82rem; margin:0 4px 14px }
  h1:empty, #sub:empty { display:none }
  .group { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.04em;
           margin:18px 16px 6px }
  .card { background:var(--card); border-radius:12px; overflow:hidden }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px;
         padding:11px 16px; min-height:48px; width:100%; border:0; background:none;
         color:inherit; font:inherit; text-align:left }
  .row + .row { border-top:1px solid var(--line) }
  .row .hint { display:block; color:var(--muted); font-size:.78rem }
  .row.dim { opacity:.4; pointer-events:none }
  .row.big > span:first-child { font-size:17px; font-weight:600 }
  .prose { padding:6px 16px 10px; font-size:15px; line-height:1.4 }
  .prose h3 { font-size:15px; font-weight:600; margin:14px 0 4px } .prose h4 { font-size:14px; margin:12px 0 4px }
  .prose p { margin:6px 0 } .prose p:first-child { margin-top:4px }
  .prose code { font:inherit; color:var(--muted) } .prose b { font-weight:600 }
  button.row { cursor:pointer }
  .val { color:var(--muted); font-size:.9rem; text-align:right; flex:none; max-width:55% }
  .chev::after { content:"\203A"; color:var(--muted); font-size:1.4rem; margin-left:8px; vertical-align:-2px }
  .tick { color:var(--tint); font-weight:600; flex:none }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;
         background:var(--muted) } .dot.up { background:var(--on) }
  .sw { position:relative; width:51px; height:31px; flex:none; border:0; padding:0;
        border-radius:16px; background:var(--off); transition:background .15s; cursor:pointer }
  .sw::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px;
               border-radius:50%; background:var(--knob); box-shadow:0 1px 3px rgba(0,0,0,.25);
               transition:left .15s }
  .sw.on { background:var(--on) } .sw.on::after { left:22px }
  .foot { color:var(--muted); font-size:.75rem; margin:14px 16px }
  /* the voice browser: 44 px icon buttons inside a row, families that fold */
  .grow { flex:1; min-width:0 }
  .vrow { gap:0; padding-top:2px; padding-bottom:2px; padding-right:4px; cursor:pointer }
  .ic { width:44px; height:44px; flex:none; border:0; padding:0; background:none; border-radius:22px;
        color:var(--tint); font:1.2rem/44px -apple-system, sans-serif; text-align:center; cursor:pointer }
  .ic:active { background:var(--line) }
  .ic.heart, .ic.star { color:var(--muted) } .ic.heart.on { color:#ff2d55 } .ic.star.on { color:#ffcc00 }
  .ic.off { opacity:.3; pointer-events:none }
  .gold { color:#ffcc00; font-size:.85em }
  .fold { min-height:40px; padding-top:6px; padding-bottom:6px }
  .fold .chev::after { display:inline-block; transition:transform .15s }
  .fold.open .chev::after { transform:rotate(90deg) }
  .row input { flex:1; min-width:0; font:inherit; color:inherit; background:var(--bg);
               border:1px solid var(--line); border-radius:8px; padding:8px 10px }
  /* swipe a voice row left: Hide (Unhide on a hidden one) sits behind it, as in iOS lists */
  .swipe { position:relative; overflow:hidden }
  .swipe + .swipe, .row + .swipe, .swipe + .row { border-top:1px solid var(--line) }
  .swipe > .vrow { position:relative; background:var(--card); transition:transform .2s; touch-action:pan-y }
  .swipe.open > .vrow { transform:translateX(-88px) }
  .swipe.drag > .vrow { transition:none }
  .swipe-act { position:absolute; top:0; right:0; bottom:0; width:88px; border:0; padding:0;
               background:#ff3b30; color:#fff; font:inherit; font-size:.95rem; font-weight:600; cursor:pointer }
  .swipe-act.un { background:var(--tint) }
  .vrow.hid .grow { opacity:.5 }
  .pill { flex:none; height:44px; border:0; padding:0 10px; background:none; color:var(--tint);
          font:inherit; font-size:.95rem; cursor:pointer }
  .pill[disabled] { color:var(--muted) }
  /* a row you tap to pick, with icon buttons beside it (a button can't hold buttons) */
  .pick { flex:1; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:8px;
          min-height:44px; border:0; padding:0; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer }
  .saved { color:var(--on); font-weight:600; flex:none; font-size:.9rem }
  /* the bar at the bottom: where the mouth is going, and ♥ = hearts only */
  body.xdc main { padding-bottom:96px }
  .bar.bottom { display:block; position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--card);
         font-size:inherit; padding:6px 10px calc(6px + env(safe-area-inset-bottom)) }
  .bar.bottom:has(#bar:empty) { display:none }   /* nothing to show until the state comes */
  .bar-in { max-width:560px; margin:0 auto; display:flex; align-items:center; gap:4px }
  .bar-in .pick { padding:0 6px }
  .bar-in .hint { display:block; color:var(--muted); font-size:.75rem }
  .barsw { flex:none; display:flex; align-items:center; gap:6px; padding-left:6px }
  .barsw .hint { display:inline; white-space:nowrap }
  .bar-in .pick > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  /* the bar's picker opens above the bar, inside it: in the shell that keeps it in the Settings column */
  .sheet { position:absolute; left:0; right:0; bottom:100%; z-index:6; padding:0 10px 8px }
  .sheet .card { max-width:560px; margin:0 auto; box-shadow:0 4px 24px rgba(0,0,0,.25) }
  .foot.warn { color:#ff3b30 }
  .row .lab { flex:none; min-width:64px }

  /* THE SHELL: the ear strip on top, never hidden; two rooms. Phone: two
     tabs. Wide (900px): two columns, Settings a column Talk can hide (data-settings="hidden").
     The page is one viewport high and each room scrolls itself, so the mouth's bar sits at the
     bottom of the Settings room, never under short content. A media query,
     not a container one: container-type on the body made it the containing block of every
     fixed thing, so the lock and the bar placed themselves on the body, not the screen. */
  body:not(.xdc) { height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  .bar.top, .tabs { flex:none; }
  /* The two rooms are one switch, not two headings: an iOS segmented control,
     a grey thumb on a grey track. On the home screen (standalone) it is the app's tab bar, at
     the bottom, in thumb reach; in Safari the bottom is Safari's, so it stays at the top. */
  .tabs { padding:6px 16px 8px; border-bottom:1px solid var(--line); }
  .seg { display:flex; padding:2px; border-radius:9px; background:var(--track); }
  .tab { flex:1; text-align:center; padding:5px 6px; border:0; border-radius:7px; background:none; font:inherit; font-size:13px; color:var(--fg); }
  .tab.on { background:var(--thumb); font-weight:600; box-shadow:0 3px 8px rgba(0,0,0,.12), 0 0 1px rgba(0,0,0,.04); }
  .tab svg { display:none; }
  @media (display-mode: standalone) {
    .rooms { order:2; }
    .tabs { order:3; padding:6px 0 env(safe-area-inset-bottom); border-bottom:0; border-top:1px solid var(--line); background:var(--glass);
            -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
    .seg { padding:0; border-radius:0; background:none; }
    .tab { display:flex; flex-direction:column; align-items:center; gap:2px; padding:2px 0 4px; font-size:10.5px; color:var(--muted); }
    .tab.on { background:none; box-shadow:none; font-weight:500; color:var(--tint); }
    .tab svg { display:block; width:26px; height:26px; }
  }
  .rooms { flex:1; min-height:0; display:grid; grid-template-columns:1fr; grid-template-rows:minmax(0,1fr); }
  .room { min-height:0; overflow:auto; }
  .room.talk { padding:0; overflow:hidden; }
  .room.talk iframe { display:block; width:100%; height:100%; border:0; }
  .room.settings { position:relative; display:flex; flex-direction:column; }
  .room.settings main { flex:1 0 auto; width:100%; }
  body:not(.xdc) .bar.bottom { position:sticky; }
  body:not(.xdc) main { padding-bottom:16px; }
  .room.hidden { display:none; }
  /* one title per view: on a phone the tab names the room, so Settings' home
     shows no h1 (the host is in the line under it); a screen below home keeps its name, small */
  body:not(.xdc) h1 { font-size:17px; font-weight:600; margin:.5em 4px .1em; }
  /* the shell's own control: show/hide the Settings column, at the right end of the strip (wide) */
  .bar.ear .side { display:none; }
  body[data-screen="home"]:not(.xdc) h1 { display:none; }   /* the tab or the column names the room */
  @media (min-width: 900px) {
    .tabs { display:none; }
    .rooms { grid-template-columns:1fr 400px; }
    .room.talk.hidden { display:block; }
    .room.settings.hidden { display:flex; }
    .room.settings { border-left:1px solid var(--line); }
    .bar.ear .side { display:inline-block; }
    body[data-settings="hidden"] .rooms { grid-template-columns:1fr; }
    body[data-settings="hidden"] .room.settings { display:none; }
  }
  body.xdc .tabs, body.xdc .room.talk, body.xdc .bar.ear .side { display:none; }   /* inside Delta Chat: the desk alone, as before */
</style>
</head>
<body>
<div class="bar top ear off" id="ear"><div class="dot"></div><div class="state"><b>Connecting…</b><span></span></div><button class="side" id="side" data-side="1" aria-pressed="true">Settings ›</button></div>
<div class="tabs" id="tabs"><div class="seg"><button class="tab" data-room="talk"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.6 3.4 6.1-.2 1.4-.8 2.7-1.8 3.6 2 0 3.8-.7 5.1-1.8 1 .3 2.1.4 3.3.4 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>Talk</button><button class="tab on" data-room="settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L14.9 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12.9 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>Settings</button></div></div>
<div class="rooms" id="rooms">
<div class="room talk hidden" id="room-talk"><iframe id="talk" title="Talk" loading="lazy"></iframe></div>
<div class="room settings" id="room-settings">
<main>
  <div class="nav" id="nav"></div>
  <h1 id="title"></h1>
  <div id="app"></div>
  <div class="foot" id="sub"></div>
</main>
<div class="bar bottom"><div id="sheet"></div><div class="bar-in" id="bar"></div></div>
</div>
</div>
<script>
(function () {
  // State = every update folded in order: "state" (from the Mac) replaces all,
  // "set" (a tap, from any device) changes one path. So every phone agrees,
  // and the Mac's reply is the truth. Screens are a stack; only this phone sees it.
  var S = null, at = null, pending = 0, stack = ["home"];
  var SOUND = {
    "turn": ["Turn ends", "a tick when you finish speaking"],
    "partial": ["While you talk", "a soft blip about every 2 s"],
    "event:device-change": ["Mic changed", ""],
    "event:turn-discarded": ["Heard, no words", "a turn the transcriber found empty"],
    "event:listen-stopped": ["Ears stopped", ""]
  };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function get(o, path) { for (var i = 0; i < path.length; i++) { if (o == null) return undefined; o = o[path[i]]; } return o; }
  function put(o, path, v) { for (var i = 0; i < path.length - 1; i++) { o[path[i]] = o[path[i]] || {}; o = o[path[i]]; } o[path[path.length - 1]] = v; }
  function send(path, value) {
    pending++;
    window.webxdc.sendUpdate({ payload: { from: "xdc", app: "notify", kind: "set", path: path, value: value,
      by: window.webxdc.selfName || "", at: new Date().toISOString() } }, "");
    render();
  }
  function attr(v) { return esc(JSON.stringify(v)); }
  function sw(path, on, value) {   // value: what a tap sends; !on unless the switch reads the setting inverted
    return '<button class="sw' + (on ? " on" : "") + '" data-path="' + attr(path) +
      '" data-value="' + attr(value === undefined ? !on : value) + '" aria-pressed="' + !!on + '"></button>';
  }
  // The engine (ears.final): its name is the schema branch's title before " (", else the
  // host; "on this Mac" only when the URL's host is a loopback (127.0.0.1,
  // localhost or ::1), anything else is "at HOST".
  function engine() {
    var t = (S && S.tools || {}).ears || {}, fs = ((t.schema || {}).properties || {})["final"] || {};
    var v = (t.value || {})["final"]; if (v === undefined) v = fs["default"];
    v = v && typeof v === "object" ? v : {};
    var m = /^[a-z]+:\/\/(\[[^\]]*\]|[^\/:?#]+)/i.exec(String(v.url || "")), host = m ? m[1] : "";
    var local = /^(127\.0\.0\.1|localhost|\[::1\]|::1)$/i.test(host), name = "";
    (fs.anyOf || fs.oneOf || []).forEach(function (b) {
      var k = b["const"];
      if (k && k.url === v.url && (k.model || "") === (v.model || "")) name = String(b.title || "").replace(/\s*\(.*$/, "");
    });
    return { name: name || host || "No engine", host: host, local: local, v: v };
  }
  // Talk's one setting: its row is drawn from Talk's own schema (.talk.schema.json,
  // which `ears services install` writes beside talk.json); off by default, so Talk shows no Debug.
  // Its key: "ears/talk" from the drawn list (no kit: <root>/ears is the voice folder), "talk"
  // when the kit's walk found it.
  function talkKey(T) { return T && T["ears/talk"] ? "ears/talk" : "talk"; }
  function talkDebug(t, key) {
    var p = ((t.schema || {}).properties || {}).show_debug || {}, on = (t.value || {}).show_debug === true;
    return row(p.title || "Show Debug in Talk", p["x-hint"] || "", sw(["tool", key, "show_debug"], on));
  }
  function nameOf(n) { return n.charAt(0).toUpperCase() + n.slice(1); }
  var DOC = { text: undefined, missing: "", asked: false };
  function fetchDoc() {   // once per page load; a 404 carries the path the file would be at
    DOC.asked = true;
    if (typeof fetch !== "function") { DOC.missing = "(no fetch here)"; return; }
    fetch("docs/what-listens.md", { cache: "no-store" }).then(function (r) {
      return r.ok ? r.text().then(function (t) { DOC.text = t; }) : r.json().then(function (j) { DOC.missing = j.missing || "?"; }, function () { DOC.missing = "?"; });
    }, function () { DOC.missing = "?"; }).then(render, render);
  }
  // A small markdown: #/## headings, paragraphs, `code`, **bold**; `<token>` becomes the live value.
  // The text is escaped first, so the file can hold nothing the page runs.
  function md(text, live) {
    var h = esc(text).replace(/`&lt;(\w+)&gt;`/g, function (m, k) { return k in live ? "<b>" + esc(live[k]) + "</b>" : m; })
      .replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    var out = "", para = [], first = true;
    function flush() { if (para.length) { out += "<p>" + para.join(" ") + "</p>"; para = []; } }
    h.split("\n").forEach(function (line) {
      var m = /^(#{1,3})\s+(.*)$/.exec(line);
      if (m) { flush(); if (m[1].length === 1 && first) { first = false; return; }   // the h1 is the screen's title
        out += "<h" + (m[1].length + 1) + ">" + m[2] + "</h" + (m[1].length + 1) + ">"; return; }
      if (!line.trim()) { flush(); return; }
      para.push(line.trim()); first = false;
    });
    flush(); return out;
  }
  function text(label, hint) {
    return '<span>' + esc(label) + (hint ? '<span class="hint">' + esc(hint) + '</span>' : "") + '</span>';
  }
  function row(label, hint, control, dim) {
    return '<div class="row' + (dim ? " dim" : "") + '">' + text(label, hint) + control + '</div>';
  }
  function link(label, hint, value, to, dim) {   // a row that dives into screen `to`
    return '<button class="row' + (dim ? " dim" : "") + '" data-go="' + esc(to) + '">' + text(label, hint) +
      '<span class="val chev">' + esc(value) + '</span></button>';
  }
  function choice(label, hint, path, value, chosen) {  // a picker row; tap = set path to value
    return '<button class="row" data-path="' + attr(path) + '" data-value="' + attr(value) + '">' +
      text(label, hint) + '<span class="tick">' + (chosen ? "✓" : "") + '</span></button>';
  }
  function card(rows) { return '<div class="card">' + rows + '</div>'; }
  function group(name) { return '<div class="group">' + esc(name) + '</div>'; }
  // The voice browser (grown from the voice
  // picker). Families fold (this phone only, closed at first);
  // a row's 🔈 says the phrase in that voice, on the Mac; ♥ = you like it, anything
  // can have one; ★ = the favourite, one per family. Tap a row to dive in.
  // Swipe a row left to hide the voice. Hidden = out of the list until "Show hidden" is on.
  // ONE hearts-only, for every list, one general pattern, on the bottom bar: voices,
  // references and outputs.
  var open = {}, heartsOnly = false, showHidden = false, draft = "";
  var savingAct = "", savedAct = "", savedUntil = 0;   // the Saved tick
  var editing = null, edDraft = "";                   // the pencil: {level, old} being edited
  var outOpen = false, barOpen = false;               // Output folded; the bar's picker
  var inOpen = false;                                 // Input folded the same way
  var swOpen = null, swHid = false;   // the one row swiped open, and whether it was hidden then
  var KOKORO_WHO = { af: "American woman", am: "American man", bf: "British woman", bm: "British man" };
  function M() { return S.mouth || {}; }
  // The host the state came from: the server names it, the page never guesses.
  function H() { return (S && S.host) || "the host"; }
  function hostTitle() { return (S && S.host) || "Settings"; }
  function P() { return M().prefs || {}; }
  function hearted(v) { return (P().hearts || []).indexOf(v) >= 0; }
  function refHearted(v, n) { return ((P().refhearts || {})[v] || []).indexOf(n) >= 0; }
  function isHidden(v) { return (P().hidden || []).indexOf(v) >= 0; }
  function familyOf(v) {
    var s = v.lastIndexOf("/"); if (s >= 0) return v.slice(0, s);
    var k = v.slice(0, 2); return v[2] === "_" && KOKORO_WHO[k] ? k : "";
  }
  function famName(f) { return KOKORO_WHO[f] || f.replace(/-/g, " "); }
  function vlabel(v) { var s = v.lastIndexOf("/"); return s < 0 ? v : v.slice(s + 1); }
  function vhint(v) {
    var f = familyOf(v);
    return KOKORO_WHO[f] ? KOKORO_WHO[f] + ", Kokoro" : f ? famName(f) : "on its own";
  }
  function act(cls, label, path, value, on, glyph) {   // a 44 px icon button: one tap to the Mac
    return '<button class="ic ' + cls + (on ? " on" : "") + '" aria-label="' + esc(label) + '" data-path="' +
      attr(path) + '" data-value="' + attr(value) + '">' + glyph + '</button>';
  }
  function speak(v) { return act("say", "Say the phrase as " + vlabel(v), ["voices", "say"], { voice: v }, false, "🔈"); }
  // Lines at three levels, and the audition.
  // Her page says her line: the one she was last saying there (sticky), else her
  // locked default, else the phrase. The list's 🔈 says the locked one, else the
  // phrase. The Mac resolves the same way (apply.py line_for).
  function lineFor(v, page) {
    var p = P(); return (page && (p.current || {})[v]) || (p.locked || {})[v] || p.phrase || "";
  }
  function lockedOf(v) { return (P().locked || {})[v] || ""; }
  function speakPage(v) { return act("say", "Say her line as " + vlabel(v), ["voices", "say"], { voice: v, page: true }, false, "🔈"); }
  function lockBtn(v) {
    var on = lockedOf(v) !== "" && lockedOf(v) === lineFor(v, true);
    return act("lock", on ? "Unlock: this stops being her default" : "Lock: make this her default line",
      ["voices", "lock"], { voice: v, on: !on }, on, on ? "🔒" : "🔓");
  }
  // 📝 = edit, the pencil and paper: our standard design for editing things. On her page it
  // opens her line picker, which was the "Change the line" row; in the picker it edits a
  // line where it is kept.
  var EDIT = "📝";
  function editLine(v) {
    return '<button class="ic" aria-label="Change or edit the line" data-go="' + esc("line:" + v) + '">' + EDIT + '</button>';
  }
  function cloneBtn(v, n, smp) {   // 🔈 her line cloned from this one clip: 🔊 made, ⏳ making, 🔇 can't
    var has = function (k) { return (smp[k] || []).indexOf(n) >= 0; };
    if (has("notext")) return '<button class="ic off" aria-label="No transcript: ' + esc(n) + ' can\'t be cloned from" disabled>🔇</button>';

    if (!d || d.axis !== "x") return;
    d.box.classList.remove("drag"); d.el.style.transform = "";
    swallow = Date.now() + 400;   // the click a swipe can leave behind must not dive in
    setOpen(!cancel && d.base + d.dx < -SW / 2 ? d.v : null);
  }
  document.addEventListener("touchend", function () { endDrag(false); });
  document.addEventListener("touchcancel", function () { endDrag(true); });

  document.addEventListener("input", function (e) {
    if (e.target.id === "ph") draft = e.target.value;
    if (e.target.id === "ed") edDraft = e.target.value;
    if (e.target.dataset.d) drafts[e.target.dataset.d] = e.target.value;
    if (e.target.dataset.o) (drafts[e.target.dataset.o] = drafts[e.target.dataset.o] || {})[e.target.dataset.op] = e.target.value;
  });
  document.addEventListener("click", function (e) {
    if (Date.now() < swallow) { e.preventDefault(); return; }
    var b = e.target.closest("button, [data-go]"); if (!b || b.disabled) return;
    if (b.tagName === "A") e.preventDefault();
    if (b.dataset.earsounds) {   // off: allow=false; on: allow=true, and the turn tick on if it was off
      if (b.dataset.earsounds === "off") send(["ears", "sounds", "allow"], false);
      else { send(["ears", "sounds", "allow"], true);
        var tn = ((S.ears || {}).sounds || {}).sounds || {}; if (tn.turn && tn.turn.on === false) send(["ears", "sounds", "sounds", "turn", "on"], true); }
      return;
    }
    if (swOpen !== null && !b.classList.contains("swipe-act")) { setOpen(null); return; }  // as iOS: a tap closes it
    var inSheet = !!b.closest(".sheet");
    if (barOpen && !inSheet && !b.dataset.bar) { barOpen = false; render(); if (!b.closest(".bar")) return; }
    if (b.dataset.bar) { barOpen = !barOpen; render(); return; }
    if (b.dataset.signout) { if (me()) me().signOut(); return; }
    if (b.dataset.addkey) { if (me()) me().addKey(); return; }
    if (b.dataset.remove) {   // remove the passkey; web.py keeps the last one
      var rm = JSON.parse(b.dataset.remove);
      if (me() && confirm("Remove the passkey \"" + rm.name + "\"? It won't open Settings any more.")) me().remove(rm.id);
      return; }
    if (b.dataset.rename) {   // 📝 = edit (the design language): a name for the passkey
      var rk = JSON.parse(b.dataset.rename), nn = prompt("Name this passkey", rk.name);
      if (nn !== null && me()) me().rename(rk.id, nn); return; }
    if (b.dataset.back) { stack.pop(); render(); toTop(); return; }
    if (b.dataset.fold !== undefined) { open[b.dataset.fold] = !open[b.dataset.fold]; render(); return; }
    if (b.dataset.outfold) { outOpen = !outOpen; render(); return; }
    if (b.dataset.infold) { inOpen = !inOpen; render(); return; }
    if (b.dataset.local === "hearts") { heartsOnly = !heartsOnly; render(); return; }
    if (b.dataset.local === "hidden") { showHidden = !showHidden; render(); return; }
    if (b.dataset.edit) { editing = JSON.parse(b.dataset.edit); edDraft = editing.old; render();
      var ed = document.getElementById("ed"); if (ed) { ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); } return; }
    if (b.dataset.editCancel) { editing = null; render(); return; }
    if (b.dataset.other) { otherOpen[b.dataset.other] = !otherOpen[b.dataset.other]; render(); return; }
    if (b.dataset.fedit) {
      fieldEd = b.dataset.fedit; drafts[fieldEd] = String(JSON.parse(b.dataset.fval)); render();
      var fe = document.getElementById("f:" + fieldEd); if (fe) fe.focus(); return; }
    if (b.dataset.fcancel) { fieldEd = ""; render(); return; }
    if (b.dataset.fsave) {
      var fv = (drafts[b.dataset.fsave] || "").trim(), ft = b.dataset.ftype;
      fieldEd = "";
      if (ft === "string") send(JSON.parse(b.dataset.fsave), fv);
      else if (fv !== "" && !isNaN(Number(fv))) send(JSON.parse(b.dataset.fsave), Number(fv));
      else render();
      return;
    }
    if (b.dataset.osave) {   // the free branch's fields as one value; an empty field is left out
      var od = drafts[b.dataset.osave] || {}, ov = {};
      Object.keys(od).forEach(function (q) { var x = String(od[q]).trim(); if (x) ov[q] = x; });
      otherOpen[b.dataset.osave] = false;
      send(JSON.parse(b.dataset.osave), ov);
      return;
    }
    if (b.dataset.editSave) {
      var nt = edDraft.replace(/\s+/g, " ").trim();
      if (nt && editing && nt !== editing.old)
        send(["voices", "lines", "edit"], { voice: b.dataset.voice, level: editing.level, old: editing.old, text: nt });
      editing = null; render(); return;
    }
    if (b.dataset.act) {
      var t = draft.replace(/\s+/g, " ").trim(), a = b.dataset.act, bv = b.dataset.voice; if (!t) return;
      if (a === "try") send(["voices", "phrase"], t);
      else if (a === "ltry") send(["voices", "say"], { voice: bv, text: t });   // said once, kept nowhere
      else {   // a save: one at a time, then ✓ Saved once the Mac's state comes back
        if (savingAct) return;
        savingAct = a; savedAct = "";
        if (a === "add") send(["voices", "phrases", "add"], t);
        else send(["voices", "lines", "add"], { voice: bv, level: a.slice(1), text: t });   // lvoice lfamily lglobal
      }
      return;
    }
    if (b.dataset.go) {
      if (b.dataset.openout) { outOpen = true; barOpen = false; if (stack[stack.length - 1] === b.dataset.go) { render(); return; } }
      stack.push(b.dataset.go); render(); toTop(); return;
    }
    if (b.dataset.path) {
      var path = JSON.parse(b.dataset.path);
      if (path[0] === "mouth" && path[1] === "output") { outOpen = false; barOpen = false; }   // picking one folds it again
      if (path[0] === "ears" && path[1] === "input") inOpen = false;
      if (path[0] === "tool") { inOpen = false; outOpen = false; otherOpen[JSON.stringify(path)] = false; }
      send(path, JSON.parse(b.dataset.value));
    }
  });
  if (!window.webxdc) return;
  window.webxdc.setUpdateListener(function (u) {
    var p = u && u.payload; if (!p) return;
    if (p.kind === "state" && p.app === "notify") {
      S = { global: p.global || {}, ears: p.ears || {}, mouth: p.mouth || {}, devices: p.devices || {},
            tools: p.tools || {}, said: p.said || null, host: p.host || "", hears: p.hears || {} };
      at = p.at; pending = 0;
      if (savingAct) {   // the Mac has answered the save: tick it for 2.5 s
        savedAct = savingAct; savingAct = ""; savedUntil = Date.now() + 2500;
        setTimeout(render, 2600);
      }
    } else if (p.kind === "set" && S && Array.isArray(p.path) && p.path[0] === "tool") {
      var tt = (S.tools || {})[p.path[1]];
      if (tt && tt.value && p.path.length > 2) put(tt.value, p.path.slice(2), p.value);
    } else if (p.kind === "set" && S && Array.isArray(p.path) && p.path[0] !== "voices" &&
               !(p.path[0] === "mouth" && (p.path[1] === "heart" || p.path[1] === "test"))) {
      put(S, p.path, p.value);   // voices.*, mouth.heart and mouth.test are actions: the Mac's reply shows them
    }
    if (swOpen !== null && S && isHidden(swOpen) !== swHid) swOpen = null;   // Hide landed: close the row
    if (u.serial === u.max_serial) render();
  }, 0);
})();
</script>
